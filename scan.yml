name: Swing Trade Scanner

on:
  schedule:
    # NOTE: GitHub Actions cron is UTC and does NOT auto-adjust for US DST.
    # Both EST and EDT versions are included below so the scan fires at the
    # right US Eastern time year-round.
    #
    # Run 1 - "morning" scan, fires at market open (9:30am ET). Output lands
    # over midday since the scan takes ~2.5 hours.
    #   EDT (Mar-Nov): 13:30 UTC   |   EST (Nov-Mar): 14:30 UTC
    #
    # Run 2 - "pre-close" scan. The scan takes ~2.5 hours, so it starts
    # ~3 hours before market close (1:00pm ET) so the results land right
    # around the closing bell (4:00pm ET) instead of hours after the market
    # has already shut.
    #   EDT (Mar-Nov): 17:00 UTC   |   EST (Nov-Mar): 18:00 UTC
    - cron: '30 13 * * 1-5'   # morning scan, EDT
    - cron: '30 14 * * 1-5'   # morning scan, EST
    - cron: '0 17 * * 1-5'    # pre-close scan (starts ~3h early), EDT
    - cron: '0 18 * * 1-5'    # pre-close scan (starts ~3h early), EST
  workflow_dispatch: {}        # lets you trigger a manual run from the GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      # Finds wherever scanner.py actually lives in the repo (root, a
      # subfolder, a nested subfolder from an unzip mishap, etc.) instead of
      # assuming a fixed path. This removes an entire recurring failure mode
      # ("cd swing-bot: No such file or directory") caused by the repo's
      # folder structure not matching a hardcoded assumption.
      - name: Locate project directory
        id: locate
        run: |
          SCANNER_PATH=$(find . -name "scanner.py" -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$SCANNER_PATH" ]; then
            echo "ERROR: could not find scanner.py anywhere in this repo."
            echo "Check that the project files were actually pushed - see the repo's root file listing on GitHub."
            exit 1
          fi
          PROJECT_DIR=$(dirname "$SCANNER_PATH")
          echo "Found scanner.py at: $SCANNER_PATH"
          echo "Using project directory: $PROJECT_DIR"
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      # Determines whether THIS specific cron trigger matches the season
      # (EDT/EST) it was designed for. Without this, both the EDT and EST
      # version of a trigger fire every day, only ~1 hour apart - but a full
      # scan takes ~2.5 hours, so both runs were actually executing at the
      # SAME TIME, both starting from the same cached cooldown state, and
      # both independently alerting on the same matches before either one's
      # updated state saved. This is the real cause of repeated alerts on
      # the same symbol within the cooldown window - it was never a
      # persistence bug, it was two full scans racing each other.
      - name: Check if this trigger matches the current DST season
        id: dst_check
        run: |
          CURRENT_SEASON=$(TZ=America/New_York date +%Z)
          SCHEDULE="${{ github.event.schedule }}"

          if [ "$SCHEDULE" = "30 13 * * 1-5" ] || [ "$SCHEDULE" = "0 17 * * 1-5" ]; then
            INTENDED_SEASON="EDT"
          elif [ "$SCHEDULE" = "30 14 * * 1-5" ] || [ "$SCHEDULE" = "0 18 * * 1-5" ]; then
            INTENDED_SEASON="EST"
          else
            # Manual trigger (workflow_dispatch) - always run.
            INTENDED_SEASON="$CURRENT_SEASON"
          fi

          echo "Current season: $CURRENT_SEASON, this trigger's intended season: $INTENDED_SEASON"
          if [ "$CURRENT_SEASON" = "$INTENDED_SEASON" ]; then
            echo "should_run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should_run=false" >> "$GITHUB_OUTPUT"
            echo "Skipping - this trigger is for the other DST season."
          fi

      - name: Set up Python
        if: steps.dst_check.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.dst_check.outputs.should_run == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: pip install -r requirements.txt

      # Alert cooldown state persists via GitHub Actions cache. This needs
      # no special repo settings and has no push/conflict failure mode
      # (unlike an earlier version of this workflow, which tried committing
      # the state file back to the repo). The cache key is unique per run
      # (so a save always happens at the end of the job), and restore-keys
      # pulls in the most recent previous run's state.
      - name: Restore alert cooldown state
        if: steps.dst_check.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: ${{ steps.locate.outputs.project_dir }}/state/alerted_symbols.json
          key: swing-bot-state-${{ github.run_id }}
          restore-keys: |
            swing-bot-state-

      - name: Show restored state (for debugging)
        if: steps.dst_check.outputs.should_run == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        run: |
          if [ -f state/alerted_symbols.json ]; then
            echo "Restored state file:"
            cat state/alerted_symbols.json
          else
            echo "No prior state file found - starting fresh (expected on the very first run)."
          fi

      - name: Run scanner
        if: steps.dst_check.outputs.should_run == 'true'
        working-directory: ${{ steps.locate.outputs.project_dir }}
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          CHART_IMG_API_KEY: ${{ secrets.CHART_IMG_API_KEY }}
        run: python scanner.py
