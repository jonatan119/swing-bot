name: Swing Trade Scanner

on:
  schedule:
    # NOTE: GitHub Actions cron is UTC and does NOT auto-adjust for US DST.
    # Both EST and EDT versions of open/close are included below so the
    # scan fires close to 9:30am and 4:00pm US Eastern year-round.
    # EDT (Mar-Nov): open 13:30 UTC, close 20:00 UTC
    # EST (Nov-Mar): open 14:30 UTC, close 21:00 UTC
    - cron: '30 13 * * 1-5'   # ~market open, EDT
    - cron: '0 20 * * 1-5'    # ~market close, EDT
    - cron: '30 14 * * 1-5'   # ~market open, EST
    - cron: '0 21 * * 1-5'    # ~market close, EST
  workflow_dispatch: {}        # lets you trigger a manual run from the GitHub UI

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run scanner
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python scanner.py
